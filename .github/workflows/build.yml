name: Build LedgerFlow Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build Debug APK (arm64 + universal)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -x lint

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: LedgerFlow-arm64-Debug
          path: android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: warn

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: LedgerFlow-Universal-Debug
          path: android/app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: warn
