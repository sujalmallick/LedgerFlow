apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    /* Bundling: bundle all variants so debug APK runs standalone without requiring active Metro server */
    debuggableVariants = []
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.ledgerflow"
    defaultConfig {
        applicationId "com.ledgerflow"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.0.1"
    }

    splits {
        abi {
            reset()
            enable true
            universalApk true
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('LEDGERFLOW_UPLOAD_STORE_FILE') || System.getenv('LEDGERFLOW_UPLOAD_STORE_FILE')) {
                def storeFilePath = project.findProperty('LEDGERFLOW_UPLOAD_STORE_FILE') ?: System.getenv('LEDGERFLOW_UPLOAD_STORE_FILE')
                storeFile file(storeFilePath)
                storePassword project.findProperty('LEDGERFLOW_UPLOAD_STORE_PASSWORD') ?: System.getenv('LEDGERFLOW_UPLOAD_STORE_PASSWORD')
                keyAlias project.findProperty('LEDGERFLOW_UPLOAD_KEY_ALIAS') ?: System.getenv('LEDGERFLOW_UPLOAD_KEY_ALIAS')
                keyPassword project.findProperty('LEDGERFLOW_UPLOAD_KEY_PASSWORD') ?: System.getenv('LEDGERFLOW_UPLOAD_KEY_PASSWORD')
            } else {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
